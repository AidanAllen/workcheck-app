name: Android 打包

# 打 tag（v1.0.0 这种）自动出包，也可以在 Actions 页面手动点一次。
# 本机不需要装 JDK / Android SDK：整个构建都在 runner 上跑完，产物直接下载。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 放在 job 级，step 的 if 才能读到（step 自己的 env 在 if 求值之后才生效）
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'          # 必须是 21：Capacitor 7 的 capacitor-android 用 Java 21 编译（JDK 17 会报"无效的源发行版: 21"）

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Capacitor 依赖
        working-directory: mobile
        run: npm ci

      - name: 同步 Web 资源与配置
        working-directory: mobile
        run: npx cap sync android

      # 没配签名就出未签名的 release 包（能装，但不能上架）；
      # 配了 KEYSTORE_B64 等四个 Secrets 就签成可发布的包。
      - name: 准备签名
        working-directory: mobile/android
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > ../workcheck.jks
          cat > keystore.properties <<EOF
          storeFile=../workcheck.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 构建 Release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: workcheck-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
